<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PHP → USD 成本计算器</title>
  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --line:#e8ebf0;
      --soft:#f8fafc;
      --dark:#111827;
      --green:#0f9f6e;
      --green-bg:#ecfdf5;
      --blue:#2563eb;
      --shadow:0 24px 70px rgba(17,24,39,.08);
    }

    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px;
      background:
        radial-gradient(circle at 20% 10%, rgba(37,99,235,.06), transparent 28%),
        radial-gradient(circle at 85% 80%, rgba(15,159,110,.05), transparent 30%),
        var(--bg);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
      color:var(--text);
    }

    .app{
      width:min(720px,100%);
    }

    .card{
      background:rgba(255,255,255,.96);
      border:1px solid rgba(229,231,235,.9);
      border-radius:28px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .top{
      padding:30px 32px 24px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:20px;
      border-bottom:1px solid var(--line);
    }

    .eyebrow{
      font-size:13px;
      color:var(--blue);
      font-weight:800;
      letter-spacing:.5px;
      margin-bottom:8px;
    }

    h1{
      margin:0;
      font-size:30px;
      line-height:1.15;
      letter-spacing:-.6px;
    }

    .desc{
      margin-top:9px;
      color:var(--muted);
      font-size:14px;
      line-height:1.6;
    }

    .live{
      display:flex;
      align-items:center;
      gap:8px;
      padding:9px 12px;
      border-radius:999px;
      background:var(--green-bg);
      color:var(--green);
      font-size:13px;
      font-weight:800;
      white-space:nowrap;
    }

    .dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:#22c55e;
      box-shadow:0 0 0 4px rgba(34,197,94,.12);
    }

    .body{padding:28px 32px 32px}

    .input-label{
      font-size:13px;
      color:var(--muted);
      font-weight:700;
      margin-bottom:9px;
    }

    .money-input{
      display:flex;
      align-items:center;
      gap:12px;
      height:70px;
      padding:0 18px;
      border:1px solid var(--line);
      border-radius:18px;
      background:#fff;
      transition:.18s ease;
    }

    .money-input:focus-within{
      border-color:#c7d2fe;
      box-shadow:0 0 0 5px rgba(37,99,235,.06);
    }

    .flag{font-size:25px}
    .currency{
      min-width:52px;
      font-size:15px;
      font-weight:800;
      color:#374151;
    }

    .money-input input{
      width:100%;
      border:0;
      outline:0;
      font-size:28px;
      font-weight:800;
      color:var(--text);
      background:transparent;
      text-align:right;
    }

    .ratebar{
      margin:14px 0 22px;
      display:flex;
      justify-content:space-between;
      gap:16px;
      flex-wrap:wrap;
      color:var(--muted);
      font-size:13px;
    }

    .ratebar strong{color:#374151}

    .result{
      background:linear-gradient(180deg,#fbfcfe 0%,#f8fafc 100%);
      border:1px solid var(--line);
      border-radius:22px;
      padding:22px;
    }

    .result-head{
      display:flex;
      justify-content:space-between;
      gap:20px;
      align-items:flex-end;
      padding-bottom:20px;
      border-bottom:1px dashed #d9dee7;
    }

    .label{
      color:var(--muted);
      font-size:13px;
      font-weight:700;
      margin-bottom:7px;
    }

    .usd-main{
      font-size:42px;
      font-weight:900;
      letter-spacing:-1px;
    }

    .mini{
      text-align:right;
      color:var(--muted);
      font-size:13px;
      line-height:1.7;
    }

    .steps{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
      margin-top:18px;
    }

    .step{
      display:flex;
      justify-content:space-between;
      gap:20px;
      align-items:center;
      padding:14px 15px;
      border-radius:14px;
      background:#fff;
      border:1px solid #edf0f4;
    }

    .step-left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .badge{
      width:28px;
      height:28px;
      display:grid;
      place-items:center;
      border-radius:9px;
      background:#f3f4f6;
      color:#374151;
      font-size:12px;
      font-weight:900;
      flex:0 0 auto;
    }

    .step-title{
      font-size:14px;
      font-weight:800;
      color:#374151;
    }

    .step-sub{
      margin-top:2px;
      font-size:12px;
      color:var(--muted);
    }

    .step-value{
      font-size:16px;
      font-weight:900;
      white-space:nowrap;
    }

    .final{
      margin-top:16px;
      border-radius:18px;
      padding:20px;
      background:var(--dark);
      color:white;
      display:flex;
      justify-content:space-between;
      align-items:end;
      gap:18px;
    }

    .final .label{color:#aeb7c5;margin:0 0 7px}
    .final-amount{
      font-size:36px;
      font-weight:900;
      letter-spacing:-.7px;
    }

    .formula{
      text-align:right;
      color:#cbd5e1;
      font-size:12px;
      line-height:1.65;
    }

    .actions{
      margin-top:18px;
      display:flex;
      gap:10px;
    }

    button{
      border:0;
      height:46px;
      padding:0 18px;
      border-radius:12px;
      font-size:14px;
      font-weight:800;
      cursor:pointer;
      transition:.15s ease;
    }

    .primary{
      background:#111827;
      color:#fff;
    }

    .secondary{
      background:#fff;
      color:#374151;
      border:1px solid var(--line);
    }

    button:hover{transform:translateY(-1px)}
    button:disabled{opacity:.55;cursor:not-allowed;transform:none}

    .foot{
      margin-top:16px;
      color:var(--muted);
      font-size:12px;
      line-height:1.65;
    }

    .ok{color:var(--green);font-weight:800}
    .err{color:#dc2626;font-weight:800}

    @media (max-width:640px){
      body{padding:12px;align-items:flex-start}
      .top,.body{padding-left:18px;padding-right:18px}
      .top{padding-top:22px}
      h1{font-size:25px}
      .live{padding:8px 10px}
      .money-input{height:64px}
      .money-input input{font-size:24px}
      .result-head,.final{
        align-items:flex-start;
        flex-direction:column;
      }
      .mini,.formula{text-align:left}
      .usd-main{font-size:36px}
      .final-amount{font-size:32px}
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card">
      <div class="top">
        <div>
          <div class="eyebrow">PHP → USD</div>
          <h1>菲律宾比索成本计算器</h1>
          <div class="desc">输入菲律宾比索，自动换算美元并计算最终实际成本。</div>
        </div>
        <div class="live"><span class="dot"></span><span id="liveText">联网汇率</span></div>
      </div>

      <div class="body">
        <div class="input-label">菲律宾比索金额</div>
        <div class="money-input">
          <span class="flag">🇵🇭</span>
          <span class="currency">PHP</span>
          <input id="phpAmount" type="number" min="0" step="0.01" value="5685" inputmode="decimal" />
        </div>

        <div class="ratebar">
          <span>实时汇率：<strong id="rateText">正在获取…</strong></span>
          <span>更新：<strong id="updatedText">—</strong></span>
        </div>

        <div class="result">
          <div class="result-head">
            <div>
              <div class="label">汇率换算后的美元</div>
              <div id="baseUsd" class="usd-main">$—</div>
            </div>
            <div class="mini">
              <div>菲律宾比索：<strong id="phpView">₱—</strong></div>
              <div>美元金额：<strong id="usdView">$—</strong></div>
            </div>
          </div>

          <div class="steps">
            <div class="step">
              <div class="step-left">
                <div class="badge">1</div>
                <div>
                  <div class="step-title">汇率换算</div>
                  <div class="step-sub">PHP × 实时汇率</div>
                </div>
              </div>
              <div id="step1" class="step-value">$—</div>
            </div>

            <div class="step">
              <div class="step-left">
                <div class="badge">2</div>
                <div>
                  <div class="step-title">开卡费</div>
                  <div class="step-sub">换算金额 + $0.30</div>
                </div>
              </div>
              <div id="step2" class="step-value">$—</div>
            </div>

            <div class="step">
              <div class="step-left">
                <div class="badge">3</div>
                <div>
                  <div class="step-title">充值手续费</div>
                  <div class="step-sub">上一步金额 × 1.0035</div>
                </div>
              </div>
              <div id="step3" class="step-value">$—</div>
            </div>
          </div>

          <div class="final">
            <div>
              <div class="label">最终需要准备的美元</div>
              <div id="finalUsd" class="final-amount">$—</div>
            </div>
            <div class="formula">
              公式：<br>
              （PHP 换算 USD + 0.30）× 1.0035
            </div>
          </div>
        </div>

        <div class="actions">
          <button id="refreshBtn" class="primary">刷新汇率</button>
          <button id="copyBtn" class="secondary">复制结果</button>
        </div>

        <div class="foot">
          状态：<span id="statusText">连接中</span><br>
          汇率数据来自 Frankfurter 公共汇率 API。实际扣款可能因发卡行汇率略有差异。
        </div>
      </div>
    </section>
  </main>

<script>
const phpInput = document.getElementById('phpAmount');
const rateText = document.getElementById('rateText');
const updatedText = document.getElementById('updatedText');
const baseUsd = document.getElementById('baseUsd');
const phpView = document.getElementById('phpView');
const usdView = document.getElementById('usdView');
const step1 = document.getElementById('step1');
const step2 = document.getElementById('step2');
const step3 = document.getElementById('step3');
const finalUsd = document.getElementById('finalUsd');
const statusText = document.getElementById('statusText');
const refreshBtn = document.getElementById('refreshBtn');
const copyBtn = document.getElementById('copyBtn');

let phpToUsd = null;
let rateDate = null;
let loading = false;

function fmtUSD(n){
  return Number.isFinite(n)
    ? '$' + n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})
    : '$—';
}
function fmtPHP(n){
  return Number.isFinite(n)
    ? '₱' + n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})
    : '₱—';
}

function calculate(){
  const php = Number(phpInput.value);
  if(!Number.isFinite(php) || php < 0 || !phpToUsd){
    [baseUsd, usdView, step1, step2, step3, finalUsd].forEach(el => el.textContent = '$—');
    phpView.textContent = fmtPHP(Number.isFinite(php) ? php : NaN);
    return;
  }

  const converted = php * phpToUsd;
  const withCardFee = converted + 0.30;
  const finalCost = withCardFee * 1.0035;

  phpView.textContent = fmtPHP(php);
  usdView.textContent = fmtUSD(converted);
  baseUsd.textContent = fmtUSD(converted);
  step1.textContent = fmtUSD(converted);
  step2.textContent = fmtUSD(withCardFee);
  step3.textContent = fmtUSD(finalCost);
  finalUsd.textContent = fmtUSD(finalCost);
}

async function loadRate(){
  if(loading) return;
  loading = true;
  refreshBtn.disabled = true;
  statusText.textContent = '正在获取最新汇率';
  statusText.className = '';
  document.getElementById('liveText').textContent = '更新中';

  try{
    const res = await fetch('https://api.frankfurter.dev/v2/rate/php/usd', {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const rate = Number(data.rate);
    if(!Number.isFinite(rate)) throw new Error('Invalid rate');

    phpToUsd = rate;
    rateDate = data.date || '';
    rateText.textContent = `1 PHP = ${rate.toFixed(6)} USD`;
    updatedText.textContent = rateDate ? `${rateDate} · ${new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}` : new Date().toLocaleString('zh-CN');
    statusText.textContent = '已更新';
    statusText.className = 'ok';
    document.getElementById('liveText').textContent = '联网汇率';
    calculate();
  }catch(e){
    statusText.textContent = '获取失败，请点击“刷新汇率”重试';
    statusText.className = 'err';
    rateText.textContent = '暂时无法获取';
    document.getElementById('liveText').textContent = '获取失败';
  }finally{
    loading = false;
    refreshBtn.disabled = false;
  }
}

phpInput.addEventListener('input', calculate);
refreshBtn.addEventListener('click', loadRate);

copyBtn.addEventListener('click', async ()=>{
  const php = Number(phpInput.value);
  if(!phpToUsd || !Number.isFinite(php)) return;
  const converted = php * phpToUsd;
  const withCardFee = converted + 0.30;
  const finalCost = withCardFee * 1.0035;
  const text =
`PHP ${php.toFixed(2)}
换算美元：${fmtUSD(converted)}
+ 开卡费 $0.30：${fmtUSD(withCardFee)}
× 1.0035：${fmtUSD(finalCost)}
最终成本：${fmtUSD(finalCost)}`;

  try{
    await navigator.clipboard.writeText(text);
    const old = copyBtn.textContent;
    copyBtn.textContent = '已复制';
    setTimeout(()=>copyBtn.textContent = old,1200);
  }catch{
    alert(text);
  }
});

loadRate();
setInterval(loadRate, 60000);
</script>
</body>
</html>
